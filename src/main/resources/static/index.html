<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포트폴리오 대시보드</title>
<link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<div class="grain"></div>

<header class="topbar">
  <div class="topbar-left">
    <span class="ticker-mark">●</span>
    <h1>PORTFOLIO LEDGER</h1>
  </div>
  <div class="topbar-right">
    <span id="clock" class="clock">--:--:--</span>
    <span class="divider">/</span>
    <span id="marketStatus" class="market-status">조회 대기</span>
  </div>
</header>

<main class="layout">

  <!-- 환율 스트립 -->
  <section class="fx-strip" id="fxStrip">
    <div class="fx-item">
      <span class="fx-label">USD / KRW</span>
      <span class="fx-value" id="fxRate">—</span>
      <span class="fx-delta" id="fxDelta">·</span>
    </div>
    <div class="fx-meta" id="fxValidUntil">유효시각 확인 중…</div>
  </section>

  <div class="main-grid">

    <!-- 좌측: 계좌 + 요약 -->
    <section class="panel account-panel">
      <div class="panel-head">
        <span class="panel-eyebrow">01 — ACCOUNT</span>
        <h2>계좌 정보</h2>
      </div>
      <div id="accountBody" class="panel-body">
        <div class="skeleton-line"></div>
      </div>

      <div class="summary-block">
        <div class="summary-row">
          <span class="summary-label">총 매입금액</span>
          <span class="summary-value" id="totalPurchaseKrw">—</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">총 매입금액 (USD)</span>
          <span class="summary-value" id="totalPurchaseUsd">—</span>
        </div>
      </div>
    </section>

    <!-- 우측: 보유 종목 -->
    <section class="panel holdings-panel">
      <div class="panel-head">
        <span class="panel-eyebrow">02 — HOLDINGS</span>
        <h2>보유 종목</h2>
        <span class="panel-hint">행을 클릭하면 시세 상세가 펼쳐져요</span>
      </div>
      <table class="holdings-table">
        <thead>
          <tr>
            <th>종목</th>
            <th>심볼</th>
            <th class="num">수량</th>
          </tr>
        </thead>
        <tbody id="holdingsBody">
          <tr><td colspan="3" class="loading-cell">불러오는 중…</td></tr>
        </tbody>
      </table>
    </section>

  </div>

  <!-- 시세 상세: 현재가 / 호가 / 체결 -->
  <section class="panel quote-panel" id="quotePanel" hidden>
    <div class="panel-head">
      <span class="panel-eyebrow">03 — MARKET DATA</span>
      <h2 id="quoteTitle">시세 상세</h2>
      <button id="closeQuoteBtn" class="close-btn" aria-label="닫기">✕</button>
    </div>

    <div class="quote-grid">
      <div class="quote-block">
        <span class="quote-block-label">현재가</span>
        <div id="priceBody" class="quote-price">—</div>
      </div>

      <div class="quote-block">
        <span class="quote-block-label">호가</span>
        <div id="orderbookBody" class="orderbook-wrap">
          <div class="skeleton-line"></div>
        </div>
      </div>

      <div class="quote-block">
        <span class="quote-block-label">최근 체결</span>
        <div id="tradesBody" class="trades-wrap">
          <div class="skeleton-line"></div>
        </div>
      </div>
    </div>
  </section>

  <footer class="foot-note">
    <span id="lastUpdated">최초 호출 전</span>
    <button id="refreshBtn" class="refresh-btn">REFRESH</button>
  </footer>

</main>

<script src="/js/dashboard.js"></script>
</body>
</html>
