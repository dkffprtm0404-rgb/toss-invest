spring:
  application:
    name: toss-invest-backend
  profiles:
    active: local
  datasource:
    url: jdbc:h2:mem:tossinvest
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8090

toss:
  api:
    base-url: https://openapi.tossinvest.com
    oauth-token-uri: /oauth2/token

logging:
  level:
    com.tossinvest: DEBUG
